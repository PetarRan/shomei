<svg width="120" height="120" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="60" cy="60" r="55" fill="url(#gradient)" stroke="#6366f1" stroke-width="2"/>
  
  <!-- Text "shō" -->
  <text x="60" y="45" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="white">shō</text>
  
  <!-- Text "mei" -->
  <text x="60" y="65" font-family="Inter, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="white">mei</text>
  
  <!-- Japanese characters -->
  <text x="60" y="85" font-family="Inter, sans-serif" font-size="12" font-weight="500" text-anchor="middle" fill="white">証明</text>
  
  <!-- Gradient definition -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
  </defs>
</svg>
