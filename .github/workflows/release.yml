name: Release and Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10.x', '3.11.x', '3.12.x']
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Verify Python version
      run: |
        python --version
        which python
        python -c "import sys; print(sys.executable)"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        echo "Installing requirements from tools/requirements.txt"
        cat tools/requirements.txt
        pip install -r tools/requirements.txt
        echo "Installing package in development mode"
        pip install -e .
      continue-on-error: false
    
    - name: List files for debugging
      run: |
        pwd
        ls -la
        ls -la tools/
        ls -la scripts/
    
    - name: Run tests
      run: |
        python scripts/test_shomei.py
      continue-on-error: false
    
    - name: Test CLI
      run: |
        shomei --help
        shomei --version
      continue-on-error: false

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: python -m build
    
    - name: Verify PyPI credentials
      run: |
        echo "Checking PyPI token availability..."
        if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
          echo "ERROR: PYPI_API_TOKEN secret is not set!"
          exit 1
        else
          echo "PyPI token is available (length: ${#PYPI_API_TOKEN})"
        fi
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        echo "Uploading to PyPI..."
        twine upload --verbose dist/*
      continue-on-error: false
    
    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref }}
        release_name: Release ${{ github.ref }}
        draft: false
        prerelease: false
