name: Release and Publish

# It will NEVER run on regular pushes to main branch
# Only triggers when you: git tag -a vX && git push origin vX
on:
  push:
    tags:
      - 'v*'  # Matches v0.1.0, v0.2.3, v1.0.0, etc.
  # Explicitly exclude other triggers
  # workflow_dispatch:  # Commented out - manual triggers disabled

jobs:
  test:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.10.x', '3.11.x', '3.12.x']
    
    steps:
    - name: Debug - Show what triggered this workflow
      run: |
        echo "🔍 DEBUG: What triggered this workflow?"
        echo "GITHUB_REF: $GITHUB_REF"
        echo "GITHUB_REF_NAME: $GITHUB_REF_NAME"
        echo "GITHUB_EVENT_NAME: $GITHUB_EVENT_NAME"
        echo "GITHUB_SHA: $GITHUB_SHA"
        echo "GITHUB_HEAD_REF: $GITHUB_HEAD_REF"
        echo "GITHUB_BASE_REF: $GITHUB_BASE_REF"
        echo ""
        echo "This should ONLY run on tags, not on regular pushes!"
        
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
    
    - name: Verify Python version
      run: |
        python --version
        which python
        python -c "import sys; print(sys.executable)"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        echo "Installing requirements from tools/requirements.txt"
        cat tools/requirements.txt
        pip install -r tools/requirements.txt
        echo "Installing package in development mode"
        pip install -e .
      continue-on-error: false
    
    - name: List files for debugging
      run: |
        pwd
        ls -la
        ls -la tools/
        ls -la scripts/
    
    - name: Run tests
      run: |
        python scripts/test_shomei.py
      continue-on-error: false
    
    - name: Test CLI
      run: |
        shomei --help
        shomei --version
      continue-on-error: false

  build-and-publish:
    needs: test
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      packages: write
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'
    
    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine
    
    - name: Build package
      run: |
        python -m build
        echo "Built packages:"
        ls -la dist/
    
    - name: Verify PyPI credentials
      run: |
        echo "Checking PyPI token availability..."
        if [ -z "${{ secrets.PYPI_API_TOKEN }}" ]; then
          echo "ERROR: PYPI_API_TOKEN secret is not set!"
          exit 1
        else
          echo "PyPI token is available (length: ${#PYPI_API_TOKEN})"
        fi
    
    - name: Verify Git tag
      run: |
        echo "Current tag: ${{ github.ref }}"
        echo "Tag name: ${{ github.ref_name }}"
        git tag --list | grep "${{ github.ref_name }}" || echo "Tag not found locally"
    
    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        echo "Uploading to PyPI..."
        echo "Package files to upload:"
        ls -la dist/
        twine upload --verbose dist/*
      continue-on-error: false
    
    - name: Create GitHub Release
      uses: actions/github-script@v7
      with:
        script: |
          try {
            console.log('🔍 Creating GitHub release...');
            console.log('Repository:', context.repo.owner + '/' + context.repo.repo);
            console.log('Tag:', context.ref.replace('refs/tags/', ''));
            console.log('Token available:', !!process.env.GITHUB_TOKEN);
            
            const { data: release } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: context.ref.replace('refs/tags/', ''),
              name: `Release ${context.ref.replace('refs/tags/', '')}`,
              body: `## What's New in ${context.ref.replace('refs/tags/', '')}\n\n- Automated release from GitHub Actions\n- Package published to PyPI\n- All tests passed successfully\n\n## Installation\n\n\`\`\`bash\npip install shomei\n\`\`\`\n\n## What's Changed\n\n- Initial release of shōmei CLI tool\n- Safe repository sanitization for GitHub contributions\n- IP protection without losing contribution history`,
              draft: false,
              prerelease: false
            });
            console.log(`✅ Release created successfully: ${release.html_url}`);
          } catch (error) {
            console.error('❌ Failed to create GitHub release:', error.message);
            console.error('Full error:', error);
            core.setFailed(`Failed to create release: ${error.message}`);
          }
