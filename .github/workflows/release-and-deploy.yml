name: Release and Deploy

on:
  push:
    branches:
      - "major/**"
      - "minor/**"
      - "patch/**"

jobs:
  release-and-deploy:
    name: "Release and Deploy: ${{ github.event.head_commit.message }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r tools/requirements.txt
          pip install -e .

      - name: Test CLI
        run: shomei --help

      - name: Build package
        run: |
          pip install build twine
          python -m build
          echo "Built packages:"
          ls -la dist/

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          echo "Uploading to PyPI..."
          twine upload --verbose dist/*
